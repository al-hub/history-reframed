name: Selective LIST achievement repair

on:
  push:
    paths:
      - .github/workflows/selective-achievement-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair only generic/problematic achievement entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from collections import Counter
          import json, re, urllib.parse, urllib.request

          path = Path('LIST.md')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()

          def parse_item(line):
              if not line.startswith('- ') or ' — ' not in line:
                  return None
              left, achievement = line[2:].split(' — ', 1)
              left = left.strip()
              achievement = achievement.strip()
              if left.startswith('[') and '](' in left:
                  name = left[1:left.index('](')]
              else:
                  name = left
              return left, name.strip(), achievement

          def norm(s):
              return re.sub(r'[^0-9A-Za-z가-힣]', '', s).lower()

          def particle(name):
              if not name:
                  return '는'
              ch = name[-1]
              code = ord(ch)
              if 0xAC00 <= code <= 0xD7A3:
                  return '은' if (code - 0xAC00) % 28 else '는'
              return '는'

          generic_markers = (
              '중요한 영향을 끼침', '큰 영향을 끼침',
              '중요한 업적을 남김', '중요한 기여를 함'
          )

          # Only the bulk-added second expansion is repaired. Earlier hand-written entries stay untouched.
          targets = []
          in_second = False
          heading = ''
          for i, line in enumerate(lines):
              if line.strip() == '## 2차 확장 후보':
                  in_second = True
                  continue
              if in_second and line.startswith('### '):
                  heading = line[4:].strip()
                  continue
              p = parse_item(line) if in_second else None
              if not p:
                  continue
              left, name, ach = p
              if any(m in ach for m in generic_markers):
                  targets.append((i, left, name, ach, heading))

          headers = {'User-Agent':'history-reframed-list-repair/1.0'}

          # Context guards reduce short-name / same-name mismatches.
          context_terms = {
              '중국 고대·중세': ('중국','한나라','당나라','송나라','명나라','청나라','상나라','주나라','진나라','전국시대','삼국시대'),
              '일본': ('일본','에도','메이지','도쿠가와','막부'),
              '남아시아': ('인도','파키스탄','방글라데시','스리랑카','네팔','무굴'),
              '동남아·오세아니아': ('태국','베트남','미얀마','버마','인도네시아','말레이시아','싱가포르','필리핀','캄보디아','라오스','오스트레일리아','뉴질랜드'),
              '중동·중앙아시아': ('이란','페르시아','튀르키예','터키','오스만','아랍','시리아','이라크','중앙아시아','몽골','티무르'),
              '아프리카': ('아프리카','이집트','에티오피아','가나','나이지리아','남아프리카','케냐','탄자니아','콩고','세네갈'),
              '유럽 중세·근세': ('유럽','프랑스','영국','잉글랜드','독일','이탈리아','스페인','포르투갈','러시아','신성 로마'),
              '유럽 근현대 정치·사상': ('유럽','프랑스','영국','독일','이탈리아','러시아','폴란드','헝가리','루마니아','유고슬라비아','체코'),
              '아메리카 정치·사회': ('미국','캐나다','멕시코','브라질','아르헨티나','칠레','쿠바','콜롬비아','베네수엘라','아메리카'),
              '과학·수학': ('수학','물리','천문','과학','통계','논리','컴퓨터'),
              '의학·생명과학': ('의학','의사','생물','생리','해부','세균','유전','화학','약리'),
              '기술·컴퓨터·산업': ('컴퓨터','공학','기업','사업','발명','기술','전자','소프트웨어','반도체','산업'),
              '문학·미술·음악·영화': ('작가','시인','화가','음악','작곡','영화','배우','예술','문학','미술'),
          }

          def search_wikidata(name, heading):
              params = urllib.parse.urlencode({
                  'action':'wbsearchentities','format':'json','language':'ko','uselang':'ko',
                  'search':name,'limit':6
              })
              url = 'https://www.wikidata.org/w/api.php?' + params
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=6) as r:
                      data = json.load(r)
              except Exception:
                  return None
              nk = norm(name)
              terms = context_terms.get(heading, ())
              candidates = []
              for hit in data.get('search', []):
                  label = hit.get('label') or ''
                  desc = hit.get('description') or ''
                  if norm(label) != nk:
                      continue
                  score = 10
                  if terms and any(t in desc for t in terms):
                      score += 5
                  if len(nk) <= 2 and terms and not any(t in desc for t in terms):
                      continue
                  candidates.append((score, hit.get('id'), desc))
              if not candidates:
                  return None
              candidates.sort(reverse=True)
              return candidates[0][1], candidates[0][2]

          found = {}
          with ThreadPoolExecutor(max_workers=28) as ex:
              fs = {ex.submit(search_wikidata, n, h):(i,n,h) for i,_,n,_,h in targets}
              for f in as_completed(fs):
                  i,n,h = fs[f]
                  try:
                      found[i] = f.result()
                  except Exception:
                      found[i] = None

          qids = sorted({v[0] for v in found.values() if v})

          def wbget(ids):
              if not ids: return {}
              params = urllib.parse.urlencode({
                  'action':'wbgetentities','format':'json','ids':'|'.join(ids),
                  'props':'labels|descriptions|claims','languages':'ko|en','languagefallback':1
              })
              req = urllib.request.Request('https://www.wikidata.org/w/api.php?' + params, headers=headers)
              with urllib.request.urlopen(req, timeout=12) as r:
                  return (json.load(r).get('entities') or {})

          entities = {}
          for k in range(0, len(qids), 40):
              try: entities.update(wbget(qids[k:k+40]))
              except Exception: pass

          props = ('P800','P166','P39','P106','P101','P135')
          refs = set()
          def claim_ids(ent, prop):
              out=[]
              for c in (ent.get('claims') or {}).get(prop, []):
                  try:
                      v=c['mainsnak']['datavalue']['value']
                      if isinstance(v,dict) and 'id' in v: out.append(v['id'])
                  except Exception: pass
              return out
          for ent in entities.values():
              for p in props: refs.update(claim_ids(ent,p)[:3])

          ref_entities = {}
          rlist=sorted(refs)
          for k in range(0,len(rlist),50):
              ids=rlist[k:k+50]
              params=urllib.parse.urlencode({'action':'wbgetentities','format':'json','ids':'|'.join(ids),'props':'labels','languages':'ko|en','languagefallback':1})
              try:
                  req=urllib.request.Request('https://www.wikidata.org/w/api.php?'+params,headers=headers)
                  with urllib.request.urlopen(req,timeout=12) as r:
                      ref_entities.update((json.load(r).get('entities') or {}))
              except Exception: pass

          def label(q):
              e=ref_entities.get(q) or entities.get(q) or {}
              labs=e.get('labels') or {}
              x=labs.get('ko') or labs.get('en')
              return (x or {}).get('value') if x else None

          def labels_for(ent, prop, limit=2):
              vals=[]
              for q in claim_ids(ent,prop):
                  x=label(q)
                  if x and not re.search(r'[A-Za-z]{4,}',x): vals.append(x)
                  if len(vals)>=limit: break
              return vals

          def make_specific(name, qid, search_desc):
              ent=entities.get(qid) or {}
              desc=((ent.get('descriptions') or {}).get('ko') or {}).get('value') or search_desc or ''
              works=labels_for(ent,'P800',2)
              awards=labels_for(ent,'P166',1)
              positions=labels_for(ent,'P39',1)
              fields=labels_for(ent,'P101',2)
              occupations=labels_for(ent,'P106',2)
              movements=labels_for(ent,'P135',1)

              if works:
                  joined='·'.join(works)
                  return f'{joined} 등 대표 저작·작품으로 이름을 남김'
              if awards and fields:
                  return f'{"·".join(fields)} 분야에서 활동하고 {awards[0]} 수상 경력을 남김'
              if fields and occupations:
                  return f'{"·".join(fields)} 분야를 연구한 {"·".join(occupations)}로 활동함'
              if positions and occupations:
                  return f'{positions[0]}를 지낸 {"·".join(occupations)}로 활동함'
              if positions:
                  return f'{positions[0]}를 맡아 정치·공공 영역에서 활동함'
              if movements and occupations:
                  return f'{movements[0]} 흐름을 대표한 {"·".join(occupations)}로 활동함'
              if desc and len(desc) <= 80 and not re.search(r'[A-Za-z]{8,}',desc):
                  return desc.rstrip('. ')
              return None

          replacements={}
          improved=0
          for i,left,name,ach,h in targets:
              hit=found.get(i)
              if not hit: continue
              specific=make_specific(name,hit[0],hit[1])
              if specific and specific != ach and len(specific) >= 8:
                  replacements[i]=specific
                  improved+=1

          # Known duplicate aliases and obvious display-name defects discovered during review.
          duplicate_aliases={'단','말피기'}
          name_fixes={
              '제임스매디슨':'제임스 매디슨','알렉산더해밀턴':'알렉산더 해밀턴',
              '제임스K포크':'제임스 K. 포크','존C캘훈':'존 C. 캘훈',
              '로버트E리':'로버트 E. 리','부커T워싱턴':'부커 T. 워싱턴',
              'WEB두보이스':'W. E. B. 두보이스','아이다B웰스':'아이다 B. 웰스',
              '사무엘애덤스':'사무엘 애덤스','존애덤스':'존 애덤스'
          }

          out=[]
          removed=renamed=0
          in_second=False
          for i,line in enumerate(lines):
              if line.strip()=='## 2차 확장 후보': in_second=True
              p=parse_item(line) if in_second else None
              if p:
                  left,name,ach=p
                  if name in duplicate_aliases:
                      removed+=1
                      continue
                  if i in replacements:
                      ach=replacements[i]
                  if name in name_fixes:
                      newname=name_fixes[name]
                      if left == name: left=newname
                      renamed+=1
                  line=f'- {left} — {ach}'
              out.append(line)

          new_text='\n'.join(out)+'\n'
          old_rule='업적 문장은 인물별 핵심 기여가 드러나도록 작성하며, 동일한 업적 문장을 여러 인물에게 그대로 재사용하지 않습니다.'
          new_rule='업적은 인물별 대표적인 사건·발견·저술·정책·발명·활동이 드러나도록 구체적으로 작성하며, 인물명만 바꾼 분야별 공통 문장은 사용하지 않습니다.'
          new_text=new_text.replace(old_rule,new_rule,1)

          # Report remaining generic entries; this workflow deliberately does not overwrite uncertain matches.
          remaining=0
          after_second=False
          achievements=[]
          for line in new_text.splitlines():
              if line.strip()=='## 2차 확장 후보': after_second=True
              p=parse_item(line)
              if p:
                  achievements.append(p[2])
                  if after_second and any(m in p[2] for m in generic_markers): remaining+=1
          duplicates=sum(1 for c in Counter(achievements).values() if c>1)
          if duplicates:
              raise SystemExit(f'exact duplicate achievement texts remain: {duplicates}')

          path.write_text(new_text,encoding='utf-8')
          print(f'targets={len(targets)} improved={improved} unresolved_generic={remaining} duplicate_aliases_removed={removed} names_normalized={renamed} exact_duplicate_text_groups=0')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LIST.md
          git commit -m "Repair problematic LIST achievement entries"
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/selective-achievement-fix.yml
          git add -A
          git commit -m "Remove selective LIST repair workflow"
          git push
