name: Selective LIST achievement repair v3

on:
  push:
    paths:
      - .github/workflows/selective-achievement-fix-v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Korean spacing helper
        run: python -m pip install --quiet kiwipiepy
      - name: Repair generic entries with spacing-aware exact matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from collections import Counter
          from kiwipiepy import Kiwi
          import json, re, urllib.parse, urllib.request

          path=Path('LIST.md')
          lines=path.read_text(encoding='utf-8').splitlines()
          headers={'User-Agent':'history-reframed-list-repair/3.0'}
          kiwi=Kiwi()

          def parse(line):
              if not line.startswith('- ') or ' — ' not in line:return None
              left,ach=line[2:].split(' — ',1);left=left.strip();ach=ach.strip()
              name=left[1:left.index('](')] if left.startswith('[') and '](' in left else left
              return left,name.strip(),ach
          def norm(s):return re.sub(r'[^0-9A-Za-z가-힣]','',s).lower()
          def canon(s):
              s=re.sub(r'\([^)]*\)$','',s).strip()
              # tolerate single middle initials in article titles
              s=re.sub(r'(?<=\s)[A-Za-z]\.(?=\s)',' ',s)
              return norm(s)
          markers=('중요한 영향을 끼침','큰 영향을 끼침','중요한 업적을 남김','중요한 기여를 함')

          targets=[];sec=False;heading=''
          for i,line in enumerate(lines):
              if line.strip()=='## 2차 확장 후보':sec=True;continue
              if sec and line.startswith('### '):heading=line[4:].strip();continue
              p=parse(line) if sec else None
              if p and any(m in p[2] for m in markers):targets.append((i,*p,heading))

          def candidates(name):
              out=[name]
              try:
                  spaced=kiwi.space(name)
                  if spaced and spaced not in out:out.append(spaced)
              except Exception:pass
              # Preserve common initials as separate tokens.
              x=re.sub(r'([가-힣])([A-Z])',r'\1 \2 ',name)
              x=re.sub(r'([A-Z])([가-힣])',r'\1 \2',x)
              x=re.sub(r'\s+',' ',x).strip()
              if x not in out:out.append(x)
              return out

          def wiki_qid(name):
              nk=norm(name)
              if len(nk)<=2:return None
              best=[]
              for q in candidates(name):
                  params=urllib.parse.urlencode({'action':'query','format':'json','utf8':1,'generator':'search','gsrsearch':q,'gsrnamespace':0,'gsrlimit':10,'prop':'pageprops','ppprop':'wikibase_item','redirects':1})
                  try:
                      req=urllib.request.Request('https://ko.wikipedia.org/w/api.php?'+params,headers=headers)
                      with urllib.request.urlopen(req,timeout=8) as r:data=json.load(r)
                  except Exception:continue
                  for p in ((data.get('query') or {}).get('pages') or {}).values():
                      title=p.get('title') or '';qid=(p.get('pageprops') or {}).get('wikibase_item')
                      if not qid:continue
                      if canon(title)==nk:best.append((30,qid,title))
                      elif len(nk)>=6 and canon(title).replace('s','')==nk.replace('s',''):best.append((10,qid,title))
              if not best:return None
              best.sort(reverse=True)
              return best[0][1]

          qmap={}
          with ThreadPoolExecutor(max_workers=20) as ex:
              fs={ex.submit(wiki_qid,n):(i,n) for i,_,n,_,h in targets}
              for f in as_completed(fs):
                  i,n=fs[f]
                  try:qmap[i]=f.result()
                  except Exception:qmap[i]=None

          qids=sorted({q for q in qmap.values() if q})
          def entities(ids,props='labels|descriptions|claims'):
              if not ids:return {}
              params=urllib.parse.urlencode({'action':'wbgetentities','format':'json','ids':'|'.join(ids),'props':props,'languages':'ko|en','languagefallback':1})
              req=urllib.request.Request('https://www.wikidata.org/w/api.php?'+params,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as r:return (json.load(r).get('entities') or {})
          ents={}
          for j in range(0,len(qids),40):
              try:ents.update(entities(qids[j:j+40]))
              except Exception:pass
          def ids(e,p):
              a=[]
              for c in (e.get('claims') or {}).get(p,[]):
                  try:
                      v=c['mainsnak']['datavalue']['value']
                      if isinstance(v,dict) and v.get('id'):a.append(v['id'])
                  except Exception:pass
              return a
          props=('P800','P166','P39','P106','P101','P135','P102')
          refs=set()
          for e in ents.values():
              for p in props:refs.update(ids(e,p)[:3])
          rents={};rl=sorted(refs)
          for j in range(0,len(rl),50):
              try:rents.update(entities(rl[j:j+50],props='labels'))
              except Exception:pass
          def label(q):
              e=rents.get(q) or ents.get(q) or {};l=e.get('labels') or {};x=l.get('ko') or l.get('en');v=(x or {}).get('value') if x else None
              if v and re.search(r'[A-Za-z]{6,}',v):return None
              return v
          def labs(e,p,n=2):
              a=[]
              for q in ids(e,p):
                  x=label(q)
                  if x:a.append(x)
                  if len(a)>=n:break
              return a

          manual={
            '요':'중국 고대의 성군으로 전해지며 순에게 천하를 물려준 선양 전승의 중심 인물',
            '순':'요의 뒤를 이은 성군으로 전해지며 우에게 천하를 물려준 선양 전승의 중심 인물',
            '우':'대홍수 치수 전승으로 이름을 남기고 하나라의 시조로 전해짐',
            '탕':'하나라를 무너뜨리고 상나라를 세운 군주로 전해짐',
            '태갑':'상나라 초기 군주로 이윤의 보좌 아래 왕권을 회복한 인물로 전해짐',
            '반경':'상나라 수도를 은으로 옮겨 왕조의 정치적 안정을 회복하는 계기를 마련함',
            '무정':'상나라의 전성기를 이끈 군주로 대외 원정과 왕권 강화를 추진함',
            '포숙아':'관중의 재능을 알아보고 제 환공에게 천거한 일화로 관포지교의 상징이 됨',
            '안영':'제나라 재상으로 검소한 정치와 능숙한 외교로 이름을 남김',
            '자산':'정나라의 개혁 정치가로 법을 성문화하고 외교와 내정을 안정시킴',
            '진평':'유방의 책사로 초한전쟁과 한나라 초기 권력 안정에 여러 계책을 제시함',
            '동중서':'유교를 한 제국의 통치 이념으로 체계화하는 데 큰 영향을 끼침',
            '사마상여':'한나라 부 문학을 대표하는 작품을 남겨 한대 문학 발전에 영향을 끼침',
            '곽거병':'한 무제 때 흉노 원정에서 연승하며 한나라의 서북방 세력 확대를 이끎',
            '위청':'한 무제 때 대장군으로 흉노 원정을 지휘해 북방 군사 우위를 확보함',
          }

          def specific(name,qid):
              if name in manual:return manual[name]
              e=ents.get(qid) or {};d=((e.get('descriptions') or {}).get('ko') or {}).get('value') or ''
              works=labs(e,'P800',2);awards=labs(e,'P166',1);pos=labs(e,'P39',1);occ=labs(e,'P106',2);fld=labs(e,'P101',2);mov=labs(e,'P135',1)
              if works:return f'{"·".join(works)} 등 대표 저작·작품으로 이름을 남김'
              if awards and fld:return f'{"·".join(fld)} 분야에서 활동하며 {awards[0]}을 수상함'
              if fld and occ:return f'{"·".join(fld)} 분야를 연구한 {"·".join(occ)}로 활동함'
              if pos and occ:return f'{pos[0]}를 지낸 {"·".join(occ)}로 활동함'
              if mov and occ:return f'{mov[0]}을 대표한 {"·".join(occ)}로 활동함'
              if d and 10<=len(d)<=70 and not re.search(r'[A-Za-z]{6,}',d):return d.rstrip('. ')
              return None

          repl={};improved=0
          for i,left,name,ach,h in targets:
              s=manual.get(name)
              if not s:
                  q=qmap.get(i)
                  if q:s=specific(name,q)
              if s and s!=ach:repl[i]=s;improved+=1

          # Correct the four bad matches created by the first pass even though they no longer contain generic markers.
          bad_corrections={
              '우':manual['우'],'탕':manual['탕'],'반경':manual['반경'],'무정':manual['무정']
          }
          out=[];corrected_bad=0
          for i,line in enumerate(lines):
              p=parse(line)
              if p:
                  left,name,ach=p
                  if i in repl:ach=repl[i]
                  if name in bad_corrections and ach!=bad_corrections[name]:
                      ach=bad_corrections[name];corrected_bad+=1
                  line=f'- {left} — {ach}'
              out.append(line)
          new='\n'.join(out)+'\n'
          remaining=0;sec=False;achs=[]
          for line in new.splitlines():
              if line.strip()=='## 2차 확장 후보':sec=True
              p=parse(line)
              if p:
                  achs.append(p[2])
                  if sec and any(m in p[2] for m in markers):remaining+=1
          exact=sum(1 for c in Counter(achs).values() if c>1)
          if exact:raise SystemExit(f'exact duplicate achievement texts remain: {exact}')
          path.write_text(new,encoding='utf-8')
          print(f'targets={len(targets)} mapped_qids={sum(bool(q) for q in qmap.values())} improved={improved} bad_matches_corrected={corrected_bad} unresolved_generic={remaining} exact_duplicate_text_groups=0')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LIST.md
          if ! git diff --cached --quiet; then
            git commit -m "Expand selective LIST achievement repairs"
            git push
          fi
      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/selective-achievement-fix-v3.yml
          git add -A
          git commit -m "Remove spacing-aware LIST repair workflow"
          git push
