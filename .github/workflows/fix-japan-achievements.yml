          '야마나소젠':'호소카와 가쓰모토와 대립해 오닌의 난을 이끈 주요 다이묘 중 한 명이 됨',
          '호조소운':'이즈와 사가미를 장악해 후호조씨의 기반을 만들고 전국 다이묘의 선구자로 평가받음',
