name: Curate Japan LIST achievements
on:
  push:
    paths:
      - .github/workflows/fix-japan-achievements.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply curated Japan achievements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          fixes={
          '진무천황':'『고사기』와 『일본서기』에서 일본 초대 천황으로 전해지는 건국 신화의 중심 인물',
          '스이코천황':'일본 최초의 여성 천황으로 알려지며 쇼토쿠 태자와 함께 불교 수용과 국가체제 정비를 추진함',
          '덴무천황':'진신의 난 뒤 황권을 강화하고 율령국가 체제와 국가 역사 편찬의 기반을 정비함',
          '지토천황':'율령국가 건설을 이어가고 후지와라쿄 천도를 추진함',
          '쇼무천황':'도다이지 대불 조성과 국분사 설치를 추진해 나라시대 국가불교를 강화함',
          '간무천황':'794년 수도를 헤이안쿄로 옮겨 헤이안 시대를 열고 지방 통치와 군제를 정비함',
          '사이초':'히에이산 엔랴쿠지를 중심으로 일본 천태종을 확립함',
          '구카이':'중국에서 밀교를 배워 일본 진언종을 세우고 고야산을 수행 중심지로 발전시킴',
          '스가와라노미치자네':'헤이안 시대 학자·정치가로 뛰어난 한문학을 남겼으며 사후 학문의 신 덴진으로 숭배됨',
          '미나모토노요시이에':'후삼년의 역 등 동북 전쟁에서 활약해 미나모토 무사세력의 명성을 높임',
          '다이라노기요모리':'무사 출신으로 태정대신에 오르고 헤이시 정권을 세워 무사정치의 길을 열음',
          '호조마사코':'미나모토노 요리토모 사후 가마쿠라 막부의 권력 운영에 큰 영향력을 행사해 ‘아마쇼군’으로 불림',
          '아시카가요시마사':'은각사와 히가시야마 문화를 후원해 다도·정원·예술 발전에 큰 영향을 남김',
