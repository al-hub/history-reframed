          '도쿠가와이에미쓰':'산킨코타이 제도를 정착시키고 해외교류 제한을 강화해 에도 막부 통치체제를 확립함',
          '도쿠가와쓰나요시':'생류연민령을 시행한 5대 쇼군으로 겐로쿠 문화가 번성한 시기를 통치함',
          '다누마오키쓰구':'상업과 화폐경제를 적극 활용하는 정책을 추진해 에도 중기 경제정책의 변화를 이끎',
          '마쓰다이라사다노부':'간세이 개혁을 추진해 막부 재정 긴축과 유교적 사회질서 강화를 시도함',
          '우에스기요잔':'요네자와번의 재정·농업 개혁을 추진해 번정개혁의 대표 사례를 남김',
          '이노다다타카':'전국을 실측해 높은 정확도의 일본 전도 제작을 이끎',
          '스기타겐파쿠':'네덜란드 해부서를 번역한 『해체신서』를 펴내 일본 난학 발전의 전환점을 만듦',
          '히라가겐나이':'난학·발명·문학 등 여러 분야에서 활동하며 에레키테르 복원으로 특히 유명해짐',
          '가쓰시카호쿠사이':'『가나가와 해변의 높은 파도 아래』를 포함한 『후가쿠 36경』으로 우키요에를 세계적 예술로 확산함',
          '우타가와히로시게':'『도카이도 53차』 등 풍경 우키요에 연작으로 일본 풍경화의 대표 작가가 됨',
          '이하라사이카쿠':'도시 상인과 서민 생활을 다룬 우키요조시를 발전시켜 에도시대 대중문학을 대표함',
          '마쓰오바쇼':'하이카이를 예술적 경지로 끌어올리고 『오쿠노 호소미치』를 남김',
          '지카마쓰몬자에몬':'인형극과 가부키를 위한 작품을 다수 써 일본 근세 극문학을 대표함',
          '다카스기신사쿠':'기병대를 조직하고 조슈번 군제 개혁을 추진해 막부 타도 운동에 기여함',
          '요시다쇼인':'쇼카손주쿠에서 메이지유신 핵심 인재들을 교육하고 존왕양이 사상에 영향을 줌',
          '기도다카요시':'조슈번 지도자로 삿초동맹과 메이지유신을 추진하고 폐번치현 등 초기 개혁에 참여함',
          '야마가타아리토모':'징병제와 근대 육군 건설을 주도하고 총리를 지내며 메이지 국가의 군사·관료 체제를 강화함',
          '마쓰카타마사요시':'재정긴축과 통화정책을 추진하고 일본은행 설립을 통해 근대 금융제도 정착에 기여함',
          '사이온지긴모치':'두 차례 총리를 지내며 정당정치 발전에 참여하고 마지막 원로로서 쇼와 초기까지 영향력을 행사함',
          '가쓰가이슈':'막부 해군 근대화를 추진하고 사이고 다카모리와 협상해 에도성의 무혈개성을 성사시킴',
          '에노모토다케아키':'보신전쟁에서 에조공화국을 이끈 뒤 메이지 정부에 참여해 외교와 홋카이도 개발에 기여함',
          '도고헤이하치로':'러일전쟁 쓰시마 해전에서 연합함대를 지휘해 러시아 발틱함대에 결정적 승리를 거둠',
          '노기마레스케':'러일전쟁에서 제3군을 지휘해 뤼순 공략전을 수행한 일본 육군 장군',
          '아키야마사네유키':'러일전쟁 연합함대의 작전참모로 해군 작전계획 수립과 쓰시마 해전에 참여함',
          '아키야마요시후루':'일본 근대 기병대를 육성하고 러일전쟁에서 기병부대를 지휘함',
          '다자이오사무':'『인간 실격』과 『사양』으로 전후 일본인의 소외와 자기파괴를 강렬하게 묘사함',
          '다니자키준이치로':'『세설』·『음예예찬』 등으로 욕망·미학·일본 전통을 탐구한 근대문학을 남김',
          '엔도슈사쿠':'『침묵』을 통해 일본 사회에서의 그리스도교 신앙과 배교의 문제를 깊이 탐구함',
          '오에겐자부로':'전후 일본의 폭력·책임·개인 문제를 다룬 작품으로 1994년 노벨문학상을 수상함',
          '미야자와겐지':'『은하철도의 밤』·『주문 많은 요리점』과 독창적 시로 일본 아동·환상문학에 큰 유산을 남김',
          '오카쿠라덴신':'일본 미술 보존과 근대 미술교육을 이끌고 『차의 책』으로 동아시아 미학을 서구에 소개함',
          '야나기무네요시':'일상 공예의 아름다움을 재평가하는 민예운동을 창시함',
          '구로다세이키':'서양식 유화 교육과 외광파 화풍을 일본에 확산해 근대 양화 발전을 이끎',
          '우메하라류자부로':'서양 유화 기법과 일본적 색채를 결합한 작품으로 일본 근대 양화를 대표함',
          '혼다코타로':'강력한 영구자석 소재인 KS강을 개발해 일본 금속재료 연구를 세계적 수준으로 끌어올림',
          '유카와히데키':'핵력을 설명하기 위해 중간자 존재를 예측해 일본인 최초로 노벨물리학상을 수상함',
          '도모나가신이치로':'양자전기역학의 재규격화 이론 발전에 기여해 노벨물리학상을 수상함',
          '난부요이치로':'자발적 대칭성 깨짐 개념을 입자물리학에 적용해 현대 표준모형의 토대에 기여함',
          '도네가와스스무':'항체 유전자의 재배열 메커니즘을 밝혀 항체 다양성의 원리를 설명함',
          '오무라고교':'미생물 유래 아버멕틴 개발에 기여해 기생충 감염 치료의 혁신을 이끎',
          '다나카고이치':'생체고분자 분석을 가능하게 한 연성 레이저 탈착 질량분석 기법 개발에 기여함',
          '나카무라슈지':'고휘도 청색 LED를 실용화해 백색 LED와 고효율 조명 시대를 여는 데 기여함',
          '요시노아키라':'안전하고 충전 가능한 리튬이온전지의 실용적 구조를 개발함',
          '야마나카신야':'성체세포를 유도만능줄기세포(iPS 세포)로 되돌리는 방법을 개발함',
          '이나모리가즈오':'교세라와 KDDI를 창업하고 아메바 경영 등 독자적 경영방식을 확산함',
          '마쓰시타고노스케':'마쓰시타전기(현 파나소닉)를 창업해 일본 가전산업의 대중화와 성장에 기여함',
          '도요다기이치로':'도요타자동차를 창업하고 일본 자동차의 대량생산 체제 구축을 이끎',
          '도요다사키치':'자동직기를 발명·개량하고 자동화 원리인 ‘지도가(自働化)’의 기술적 기반을 마련함',
          '이부카마사루':'소니를 공동창업해 트랜지스터 라디오 등 일본 소비자 전자산업의 세계화를 이끎',
          '시부사와에이이치':'제일국립은행을 비롯한 수많은 근대 기업·경제기관 설립에 참여해 일본 자본주의의 기반을 구축함',
          }
          p=Path('LIST.md');lines=p.read_text(encoding='utf-8').splitlines();out=[];sec=False;heading='';changed=0
          for line in lines:
              if line.strip()=='## 2차 확장 후보':sec=True
              if sec and line.startswith('### '):heading=line[4:].strip()
              if sec and heading=='일본' and line.startswith('- ') and ' — ' in line:
                  left,_=line[2:].split(' — ',1);name=left.strip()
                  if name in fixes:line=f'- {name} — {fixes[name]}';changed+=1
              out.append(line)
          p.write_text('\n'.join(out)+'\n',encoding='utf-8');print('curated_japan=',changed)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LIST.md
          git commit -m "Curate Japan LIST achievements"
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/fix-japan-achievements.yml
          git add -A
          git commit -m "Remove Japan LIST curation workflow"
          git push
