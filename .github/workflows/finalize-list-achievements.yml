name: Finalize LIST achievements

on:
  push:
    paths:
      - .github/workflows/finalize-list-achievements.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace generic generated text with person-specific Korean summaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import html, json, re, time, urllib.parse, urllib.request

          path = Path('LIST.md')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()

          def parse_item(line):
              if not line.startswith('- ') or ' — ' not in line:
                  return None
              left, achievement = line[2:].split(' — ', 1)
              left = left.strip()
              achievement = achievement.strip()
              name = left
              if left.startswith('[') and '](' in left:
                  name = left[1:left.index('](')]
              return left, name.strip(), achievement

          def norm(s):
              return re.sub(r'[^0-9A-Za-z가-힣]', '', s).lower()

          def particle(name):
              ch = name[-1] if name else ''
              code = ord(ch)
              if 0xAC00 <= code <= 0xD7A3:
                  return '은' if (code - 0xAC00) % 28 else '는'
              return '는'

          generated_re = re.compile(r'^(?:.+로서 활동한\s+(.+?)|(.+?)\s+관련 핵심 성과):\s*(.+)$')

          # Track section context so ambiguous short names are searched safely.
          context_map = {
              '중국 고대·중세': '중국 역사',
              '일본': '일본 역사',
              '남아시아': '인도 남아시아',
              '동남아·오세아니아': '동남아시아 오세아니아',
              '중동·중앙아시아': '중동 중앙아시아 역사',
              '아프리카': '아프리카 역사',
              '유럽 중세·근세': '유럽 역사',
              '유럽 근현대 정치·사상': '유럽 정치 역사',
              '아메리카 정치·사회': '미국 중남미 정치 역사',
              '과학·수학': '과학자 수학자',
              '의학·생명과학': '의학 생명과학',
              '기술·컴퓨터·산업': '공학 컴퓨터 기업가',
              '문학·미술·음악·영화': '문학 예술 음악 영화',
          }

          targets = {}
          current_heading = ''
          in_second = False
          for line in lines:
              if line.strip() == '## 2차 확장 후보':
                  in_second = True
                  continue
              if in_second and line.startswith('### '):
                  current_heading = line[4:].strip()
                  continue
              if not in_second:
                  continue
              p = parse_item(line)
              if not p:
                  continue
              _, name, achievement = p
              m = generated_re.match(achievement)
              if m:
                  base = m.group(3).strip()
                  targets[name] = (base, current_heading)

          headers = {'User-Agent': 'history-reframed/1.0 (GitHub Actions; public history index cleanup)'}
          bad_terms = ('동음이의', '성씨', '지명', '문자 이름', '목록 문서', '분류:', '위키미디어')
          verbs = ('세우', '건국', '통일', '정복', '이끌', '발전', '발견', '발명', '개발', '저술', '집필', '주장', '개혁', '확립', '정립', '창작', '설립', '수립', '지휘', '승리', '연구', '증명', '제안', '기여', '활약', '제작', '조직', '통치', '재건', '개척', '최초', '수상', '완성', '창시', '후원')

          def request_json(url, tries=3):
              for attempt in range(tries):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=15) as r:
                          return json.load(r)
                  except Exception:
                      if attempt + 1 == tries:
                          return None
                      time.sleep(0.6 * (attempt + 1))
              return None

          def clean_sentence(s):
              s = html.unescape(s)
              s = re.sub(r'\s+', ' ', s).strip()
              s = re.sub(r'\[[0-9]+\]', '', s)
              s = s.strip(' -–—')
              if len(s) > 190:
                  s = s[:187].rsplit(' ', 1)[0] + '…'
              return s.rstrip('. ')

          def choose_sentence(extract):
              if not extract:
                  return None
              sentences = [clean_sentence(x) for x in re.split(r'(?<=[.!?])\s+|\n+', extract) if clean_sentence(x)]
              candidates = sentences[:7]
              if not candidates:
                  return None
              scored = []
              for i, s in enumerate(candidates):
                  score = sum(2 for v in verbs if v in s) - i * 0.15
                  if 25 <= len(s) <= 180:
                      score += 1
                  if any(t in s for t in bad_terms):
                      score -= 20
                  scored.append((score, s))
              scored.sort(reverse=True)
              best = scored[0][1]
              if scored[0][0] < 0:
                  return None
              return best

          def wiki_summary(name, heading):
              context = context_map.get(heading, '')
              query = f'{name} {context}'.strip()
              params = urllib.parse.urlencode({
                  'action': 'query', 'format': 'json', 'utf8': 1,
                  'generator': 'search', 'gsrsearch': query, 'gsrnamespace': 0, 'gsrlimit': 5,
                  'prop': 'extracts', 'exintro': 1, 'explaintext': 1, 'exsentences': 7,
                  'redirects': 1,
              })
              data = request_json('https://ko.wikipedia.org/w/api.php?' + params)
              if not data:
                  return None
              pages = list((data.get('query') or {}).get('pages', {}).values())
              if not pages:
                  return None
              nk = norm(name)
              ranked = []
              for p in pages:
                  title = p.get('title', '')
                  extract = (p.get('extract') or '').strip()
                  if not extract or any(t in extract[:120] for t in bad_terms):
                      continue
                  tk = norm(title)
                  score = 0
                  if tk == nk:
                      score += 8
                  elif tk.startswith(nk) or nk.startswith(tk):
                      score += 4
                  elif nk and nk in tk:
                      score += 2
                  else:
                      continue
                  # Short ambiguous names require real historical/biographical cues.
                  if len(nk) <= 2:
                      cues = ('왕', '군주', '황제', '장군', '정치가', '사상가', '학자', '시인', '작가', '과학자', '수학자', '의사', '철학자', '통치자', '인물')
                      if not any(c in extract[:260] for c in cues):
                          continue
                  sent = choose_sentence(extract)
                  if sent:
                      score += sum(1 for v in verbs if v in sent)
                      ranked.append((score, sent))
              if not ranked:
                  return None
              ranked.sort(reverse=True, key=lambda x: x[0])
              return ranked[0][1]

          results = {}
          # Low concurrency to avoid Wikimedia rate limiting.
          with ThreadPoolExecutor(max_workers=4) as ex:
              futures = {ex.submit(wiki_summary, n, h): n for n, (_, h) in targets.items()}
              for f in as_completed(futures):
                  n = futures[f]
                  try:
                      results[n] = f.result()
                  except Exception:
                      results[n] = None

          out = []
          current_heading = ''
          in_second = False
          enriched = fallback = 0
          english_leaks = 0
          for line in lines:
              if line.strip() == '## 2차 확장 후보':
                  in_second = True
                  out.append(line)
                  continue
              if in_second and line.startswith('### '):
                  current_heading = line[4:].strip()
                  out.append(line)
                  continue
              p = parse_item(line) if in_second else None
              if not p:
                  out.append(line)
                  continue
              left, name, achievement = p
              m = generated_re.match(achievement)
              if not m:
                  out.append(line)
                  continue
              base = m.group(3).strip()
              specific = results.get(name)
              # Reject English-heavy accidental descriptions.
              if specific:
                  latin = len(re.findall(r'[A-Za-z]', specific))
                  hangul = len(re.findall(r'[가-힣]', specific))
                  if latin > max(8, hangul // 2):
                      specific = None
                      english_leaks += 1
              if specific:
                  achievement = specific
                  enriched += 1
              else:
                  achievement = f'{name}{particle(name)} {base}'
                  fallback += 1
              out.append(f'- {left} — {achievement}')

          new_text = '\n'.join(out) + '\n'

          # Global checks: every achievement string unique; no previous generated boilerplate or leaked English descriptions.
          achievements = []
          for line in new_text.splitlines():
              p = parse_item(line)
              if p:
                  achievements.append(p[2])
          counts = Counter(achievements)
          dup = {a:c for a,c in counts.items() if c > 1}
          if dup:
              raise SystemExit(f'duplicate achievement texts remain: {len(dup)}')
          if re.search(r'의 (?:핵심 기여|대표 업적|역사적 의미|주요 성과|남긴 영향|주요 활동|대표적 기여|핵심 성과):', new_text):
              raise SystemExit('old generated label remains')
          if ' 관련 핵심 성과:' in new_text:
              raise SystemExit('old fallback label remains')

          path.write_text(new_text, encoding='utf-8')
          print(f'items={len(achievements)} targets={len(targets)} wikipedia_specific={enriched} clean_fallback={fallback} rejected_english={english_leaks} duplicate_groups_after=0')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LIST.md
          git commit -m "Finalize person-specific LIST achievements"
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase
          rm -f .github/workflows/finalize-list-achievements.yml
          git add -A
          git commit -m "Remove final LIST cleanup workflow"
          git push
