name: Refine LIST achievements

on:
  push:
    paths:
      - .github/workflows/refine-list-achievements.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enrich repeated achievements with person-specific roles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json, re, urllib.parse, urllib.request

          path = Path('LIST.md')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()

          labels = ['핵심 기여', '대표 업적', '역사적 의미', '주요 성과', '남긴 영향', '주요 활동', '대표적 기여', '핵심 성과']
          label_re = '|'.join(map(re.escape, labels))

          def parse_item(line):
              if not line.startswith('- ') or ' — ' not in line:
                  return None
              left, achievement = line[2:].split(' — ', 1)
              left = left.strip()
              achievement = achievement.strip()
              if left.startswith('[') and '](' in left:
                  name = left[1:left.index('](')]
              else:
                  name = left
              return left, name.strip(), achievement

          def norm(s):
              return re.sub(r'[^0-9A-Za-z가-힣]', '', s).lower()

          targets = {}
          for line in lines:
              p = parse_item(line)
              if not p:
                  continue
              _, name, achievement = p
              m = re.match(rf'^{re.escape(name)}의 (?:{label_re}): (.+)$', achievement)
              if m:
                  targets[name] = m.group(1).strip()

          headers = {'User-Agent': 'history-reframed-list-refiner/1.0 (GitHub Actions)'}

          def wikidata_role(name):
              params = urllib.parse.urlencode({
                  'action': 'wbsearchentities', 'search': name, 'language': 'ko',
                  'uselang': 'ko', 'limit': 5, 'format': 'json'
              })
              url = 'https://www.wikidata.org/w/api.php?' + params
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=12) as r:
                      data = json.load(r)
                  for hit in data.get('search', []):
                      label = hit.get('label', '')
                      desc = (hit.get('description') or '').strip()
                      if norm(label) != norm(name):
                          continue
                      if not desc or '동음이의' in desc or '위키미디어' in desc:
                          continue
                      return desc
              except Exception:
                  return None
              return None

          roles = {}
          with ThreadPoolExecutor(max_workers=10) as ex:
              futures = {ex.submit(wikidata_role, n): n for n in targets}
              for f in as_completed(futures):
                  n = futures[f]
                  try:
                      roles[n] = f.result()
                  except Exception:
                      roles[n] = None

          def topic_from_base(base):
              # Preserve the original broad claim while making the lead person-specific.
              return base

          out = []
          enriched = 0
          fallback = 0
          for line in lines:
              p = parse_item(line)
              if not p:
                  out.append(line)
                  continue
              left, name, achievement = p
              m = re.match(rf'^{re.escape(name)}의 (?:{label_re}): (.+)$', achievement)
              if not m:
                  out.append(line)
                  continue
              base = topic_from_base(m.group(1).strip())
              role = roles.get(name)
              if role:
                  achievement = f'{role}로서 활동한 {name}: {base}'
                  enriched += 1
              else:
                  achievement = f'{name} 관련 핵심 성과: {base}'
                  fallback += 1
              out.append(f'- {left} — {achievement}')

          new_text = '\n'.join(out) + '\n'

          # Verify exact achievement-text uniqueness across the complete list.
          achievements = []
          for line in new_text.splitlines():
              p = parse_item(line)
              if p:
                  achievements.append(p[2])
          counts = Counter(achievements)
          dup = {a:c for a,c in counts.items() if c > 1}
          if dup:
              raise SystemExit(f'duplicate achievement texts remain: {len(dup)}')

          # Reject the awkward form produced by the previous pass.
          if re.search(r'—\s+[^\n]+의 남긴 영향:', new_text):
              raise SystemExit('awkward generated phrase remains')

          path.write_text(new_text, encoding='utf-8')
          print(f'items={len(achievements)} refined={len(targets)} wikidata_enriched={enriched} fallback={fallback} duplicate_groups_after=0')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LIST.md
          git commit -m "Refine LIST achievement descriptions"
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase
          rm -f .github/workflows/refine-list-achievements.yml
          git add -A
          git commit -m "Remove one-time LIST refinement workflow"
          git push
