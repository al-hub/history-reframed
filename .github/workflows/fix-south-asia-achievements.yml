          '라라라지파트라이':'펀자브의 민족운동을 이끌고 사이먼위원회 반대 시위에서 부상한 뒤 사망해 독립운동의 상징이 됨',
          '수브라만야바라티':'민족주의와 여성해방을 노래한 타밀 시로 인도 독립운동과 근대문학에 영향을 줌',
