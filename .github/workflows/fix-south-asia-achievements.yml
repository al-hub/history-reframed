          '칸압둘가파르칸':'비폭력 파슈툰 운동인 쿠다이 키드마트가르를 이끈 압둘 가파르 칸의 다른 표기로, 간디와 협력한 독립운동가',
          '라다크리슈난':'인도철학을 서구에 소개한 철학자로 독립 인도의 2대 대통령을 지냄',
          '라즈고팔라차리':'독립운동에 참여하고 인도 마지막 총독을 지낸 뒤 자유당 창당 등 정치활동을 이어감',
          '랄바하두르샤스트리':'인도 총리로 1965년 인도·파키스탄 전쟁을 이끌고 “자이 자완 자이 키산” 구호를 제시함',
          '자야프라카시나라얀':'비상사태기 인디라 간디 정부에 맞선 대중운동을 이끌어 민주주의 회복에 기여함',
          '비노바바베':'토지 기부를 통한 평화적 재분배를 목표로 부단운동을 전개함',
          '자키르후세인':'교육자로 자미아 밀리아 이슬라미아 발전을 이끌고 인도 최초의 무슬림 대통령이 됨',
          '비크람사라바이':'인도 우주연구기구의 토대를 세우고 위성·우주기술을 국가개발에 활용하는 방향을 제시함',
          '호미바바':'타타기초연구소와 인도 원자력 프로그램의 기반을 세워 현대 인도 핵과학을 이끎',
          '메그나드사하':'별의 스펙트럼과 이온화 상태를 설명하는 사하 이온화 방정식을 제시함',
          '찬드라세카라벤카타라만':'빛의 비탄성 산란인 라만 효과를 발견해 1930년 노벨물리학상을 수상함',
          '호미세트나':'인도 원자력위원회 위원장으로 1974년 포크란 핵실험 프로그램의 핵심 인물로 활동함',
          '압둘칼람':'미사일·우주개발 프로젝트를 이끈 항공우주공학자로 이후 인도 대통령을 지냄',
          '하르가빈드코라나':'유전암호 해독과 단백질 합성 원리 규명에 기여해 노벨생리의학상을 수상함',
          '메리콤':'세계선수권 다관왕을 기록하고 올림픽 메달을 획득한 인도의 대표 여성 복서',
          '디안찬드':'올림픽에서 인도 필드하키의 연속 금메달을 이끈 전설적 공격수',
          '밀카싱':'아시아경기와 영연방경기에서 우승하며 인도 육상의 국제적 위상을 높인 단거리 선수',
          '카필데브':'1983년 크리켓 월드컵에서 인도 대표팀 주장으로 사상 첫 우승을 이끎',
          '사친텐둘카르':'국제 크리켓 최다 득점 기록들을 세우며 현대 크리켓의 대표 타자로 자리잡음',
          '비스와나탄아난드':'세계 체스 챔피언을 여러 차례 지내며 인도 체스 붐을 이끎',
          '라타망게슈카르':'수천 곡의 영화음악을 불러 힌디 영화음악의 상징적 플레이백 가수로 자리잡음',
          '사티야지트레이':'『아푸 3부작』을 연출해 인도 예술영화를 세계 영화사에 자리매김시킴',
          '리트윅가탁':'분단과 난민의 상처를 다룬 영화들로 벵골 예술영화에 독창적 미학을 남김',
          '미라나이르':'『살람 봄베이!』 등 인도와 디아스포라의 현실을 다룬 국제적 영화작품을 연출함',
          '라자라비바르마':'인도 신화 인물을 서양식 유화기법으로 그려 대중적 신상 이미지 형성에 큰 영향을 줌',
          '아므리타셰르길':'유럽 모더니즘과 인도 현실을 결합한 회화로 인도 현대미술의 선구자가 됨',
          '안나마니':'기상관측 장비를 개발·표준화하고 태양복사·풍력 측정 연구를 발전시킨 물리학자·기상학자',
          '자나키암말':'식물 세포유전학과 품종개량 연구를 통해 사탕수수 등 작물 연구에 기여함',
          '아심프렘지':'위프로를 IT서비스 기업으로 성장시키고 대규모 교육·공익재단 활동을 펼침',
          '자무셋지타타':'타타그룹의 기반을 세우고 철강·수력발전·고등과학 연구기관 구상을 추진함',
          'JRD타타':'타타항공을 창립해 인도 민간항공 산업을 개척하고 타타그룹의 산업 확장을 이끎',
          '디루바이암바니':'릴라이언스를 창업해 섬유에서 석유화학으로 확장하며 인도 대기업의 성장을 이끎',
          '나라야나무르티':'인포시스를 공동창업해 인도 소프트웨어·IT서비스 산업의 세계화를 이끎',
          '베르기세쿠리엔':'우유 협동조합 모델과 ‘백색혁명’을 이끌어 인도의 우유 생산 확대에 기여함',
          '일라바트':'여성자영업자협회(SEWA)를 창립해 비공식 노동 여성의 조직화와 금융 접근을 확대함',
          '아룬다티로이':'『작은 것들의 신』으로 부커상을 수상하고 환경·인권·정치 문제에 대한 비판적 글쓰기를 이어감',
          '살만루슈디':'『한밤의 아이들』과 『악마의 시』 등으로 역사·이주·종교를 다룬 현대문학을 대표함',
          'RKNarayan':'가상의 남인도 도시 말구디를 배경으로 한 소설들로 인도 영문학의 기반을 넓힘',
          '비크람세스':'『적절한 소년』 등 대하소설과 시를 통해 현대 인도 영문학의 대표 작가가 됨',
          '아미타브고시':'식민주의·이주·기후위기를 다룬 소설과 논픽션으로 현대 남아시아 문학의 지평을 넓힘',
          }
          p=Path('LIST.md');lines=p.read_text(encoding='utf-8').splitlines();out=[];sec=False;heading='';changed=0
          for line in lines:
              if line.strip()=='## 2차 확장 후보':sec=True
              if sec and line.startswith('### '):heading=line[4:].strip()
              if sec and heading=='남아시아' and line.startswith('- ') and ' — ' in line:
                  left,_=line[2:].split(' — ',1);name=left.strip()
                  if name in fixes:line=f'- {name} — {fixes[name]}';changed+=1
              out.append(line)
          p.write_text('\n'.join(out)+'\n',encoding='utf-8');print('curated_south_asia=',changed)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LIST.md
          git commit -m "Curate South Asia LIST achievements"
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/fix-south-asia-achievements.yml
          git add -A
          git commit -m "Remove South Asia LIST curation workflow"
          git push
