name: Curate South Asia LIST achievements
on:
  push:
    paths:
      - .github/workflows/fix-south-asia-achievements.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply curated South Asia achievements
        shell: bash
        run: |
          python - <<'PY'
