          out = []
          added = 0
          seen = set(existing)
          for heading, (desc, names_text) in groups.items():
              group_lines = []
              for raw in names_text.split():
                  name = raw.rstrip('?').strip()
                  k = key(name)
                  if not name or k in seen:
                      continue
                  if len(seen) >= target:
                      break
                  seen.add(k)
                  group_lines.append(f'- {name} — {desc}')
                  added += 1
              if group_lines:
                  out.append(f'### {heading}')
                  out.append('')
                  out.extend(group_lines)
                  out.append('')
              if len(seen) >= target:
                  break

          if len(seen) < target:
              raise SystemExit(f'Insufficient curated candidates: initial={initial}, target={target}, final={len(seen)}')

          block = '\n\n## 2차 확장 후보\n\n' + '\n'.join(out).rstrip() + '\n'
          path.write_text(text.rstrip() + block, encoding='utf-8')

          # Recount from the actual written file.
          final_seen = set()
          for line in path.read_text(encoding='utf-8').splitlines():
              name = display_name(line)
              if name:
                  final_seen.add(key(name))
          if len(final_seen) != target:
              raise SystemExit(f'Count mismatch: expected={target}, actual={len(final_seen)}')
          print(f'INITIAL={initial}')
          print(f'ADDED={added}')
          print(f'FINAL={len(final_seen)}')
          print(f'TARGET={target}')
          PY

      - name: Commit expanded LIST and remove one-time workflow
        shell: bash
        run: |
          git config user.name "history-reframed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add LIST.md
          git rm .github/workflows/expand-list-v2.yml
          git commit -m "Double LIST historical figure pool again"
          git push
