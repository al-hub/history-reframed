name: Expand LIST v2

on:
  push:
    paths:
      - .github/workflows/expand-list-v2.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand LIST and verify exact doubling
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('LIST.md')
          text = path.read_text(encoding='utf-8')

          def display_name(line):
              if not line.startswith('- '):
                  return None
              left = line[2:].split(' — ', 1)[0].strip()
              if left.startswith('[') and '](' in left:
                  left = left[1:left.index('](')]
              return left.strip()

          def key(name):
              return re.sub(r'[\s·.\-?·,()\[\]{}]', '', name).lower()

          existing = {}
          for line in text.splitlines():
              name = display_name(line)
              if name:
                  existing.setdefault(key(name), name)

          initial = len(existing)
          target = initial * 2

          groups = {
