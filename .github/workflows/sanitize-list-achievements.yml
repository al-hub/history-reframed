name: Sanitize LIST achievements

on:
  push:
    paths:
      - .github/workflows/sanitize-list-achievements.yml

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize achievement wording safely
        shell: bash
        run: |
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re

          path = Path('LIST.md')
          lines = path.read_text(encoding='utf-8').splitlines()

          def parse_item(line):
              if not line.startswith('- ') or ' — ' not in line:
                  return None
              left, achievement = line[2:].split(' — ', 1)
              left = left.strip()
              achievement = achievement.strip()
              name = left
              if left.startswith('[') and '](' in left:
                  name = left[1:left.index('](')]
              return left, name.strip(), achievement

          def particle(name):
              if not name:
                  return '는'
              ch = name[-1]
              code = ord(ch)
              if 0xAC00 <= code <= 0xD7A3:
                  return '은' if (code - 0xAC00) % 28 else '는'
              return '는'

          # These forms were generated by earlier cleanup passes and are not source-quality prose.
          generated = re.compile(r'^(?:.+로서 활동한\s+(.+?)|(.+?)\s+관련 핵심 성과):\s*(.+)$')

          out = []
          changed = 0
          for line in lines:
              p = parse_item(line)
              if not p:
                  out.append(line)
                  continue
              left, name, achievement = p
              m = generated.match(achievement)
              if m:
                  base = m.group(3).strip()
                  achievement = f'{name}{particle(name)} {base}'
                  changed += 1
              out.append(f'- {left} — {achievement}')

          new_text = '\n'.join(out) + '\n'

          achievements = []
          for line in new_text.splitlines():
              p = parse_item(line)
              if p:
                  achievements.append(p[2])
          dup = {a:c for a,c in Counter(achievements).items() if c > 1}
          if dup:
              raise SystemExit(f'duplicate achievement texts remain: {len(dup)}')

          # Ensure known bad machine-generated forms are gone.
          if ' 관련 핵심 성과:' in new_text:
              raise SystemExit('generated fallback wording remains')
          if re.search(r'—\s+[^\n]*[A-Za-z][^\n]*로서 활동한', new_text):
              raise SystemExit('English auto-description remains')
          if re.search(r'—\s+[^\n]+의 남긴 영향:', new_text):
              raise SystemExit('awkward wording remains')

          path.write_text(new_text, encoding='utf-8')
          print(f'items={len(achievements)} sanitized={changed} duplicate_groups_after=0')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LIST.md
          if ! git diff --cached --quiet; then
            git commit -m "Sanitize LIST achievement wording"
            git push
          fi

      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/sanitize-list-achievements.yml
          git add -A
          git commit -m "Remove LIST achievement sanitizer workflow"
          git push
