name: Curate Middle East Central Asia LIST achievements
on:
  push:
    paths:
      - .github/workflows/fix-middle-east-achievements.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply curated Middle East Central Asia achievements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          fixes={
          '사르곤':'아카드 제국을 세워 메소포타미아의 여러 도시국가를 대규모 제국으로 통합함',
          '나람신':'아카드 제국의 영토를 확대하고 스스로 신격화된 왕권을 표현한 군주로 알려짐',
          '구데아':'라가시의 통치자로 신전 건축과 구데아 석상·비문을 남겨 수메르 문화의 중요한 기록을 남김',
          '우르남무':'우르 제3왕조를 세우고 현존 최고(最古)급 성문법 가운데 하나인 우르남무 법전을 남김',
          '나보니두스':'신바빌로니아 마지막 왕으로 고대 신전과 유물을 조사·복원해 초기 고고학적 관심으로도 유명함',
          '티글라트필레세르3세':'신아시리아 제국의 군대·행정체계를 개혁하고 정복지를 속주화해 제국을 크게 확장함',
          '사르곤2세':'신아시리아 왕으로 이스라엘 왕국 정복 이후 제국을 확대하고 두르샤루킨을 건설함',
          '산헤립':'신아시리아 왕으로 수도 니네베를 대대적으로 건설·정비하고 유다 왕국을 침공함',
          '아슈르바니팔':'니네베에 대규모 점토판 도서관을 구축해 메소포타미아 문헌 보존에 결정적 유산을 남김',
          '아르타크세르크세스1세':'아케메네스 페르시아를 통치하며 이집트 반란과 그리스 세계와의 외교를 관리함',
          '미트리다테스6세':'폰토스 왕국을 이끌고 세 차례 미트리다테스 전쟁으로 로마의 동방 팽창에 맞섬',
          '샤푸르1세':'사산 왕조의 영토를 확대하고 에데사 전투에서 로마 황제 발레리아누스를 포로로 잡음',
          '호스로1세':'사산 왕조의 조세·행정·군제 개혁을 추진하고 학문·철학 번역을 후원함',
          '호스로2세':'비잔티움 제국과의 대전쟁으로 사산 제국의 영토를 일시적으로 최대 규모까지 확장함',
          '알만수르':'아바스 왕조의 실질적 기반을 다지고 바그다드를 건설해 새 제국의 수도로 삼음',
          '니잠알물크':'셀주크 제국의 재상으로 니자미야 학당을 세우고 『정치의 서』를 저술함',
          '알파라비':'아리스토텔레스 철학을 이슬람 사상과 연결하고 논리학·정치철학을 체계적으로 발전시킴',
          '아베로에스':'아리스토텔레스 주석과 철학 저술을 통해 이슬람·유럽 스콜라 철학에 큰 영향을 남김',
          '이븐알나피스':'폐순환을 설명해 심장과 폐 사이 혈액순환에 대한 중요한 의학적 설명을 제시함',
          '자브리이븐하이얀':'연금술·화학 전통과 관련된 방대한 저술군으로 증류·물질 실험법 발전에 영향을 줌',
          '알킨디':'철학·수학·광학·음악 등 그리스 학문을 아랍어 지적 전통에 정착시키는 데 기여함',
          '알자자리':'『기계장치에 관한 지식의 책』에 물시계·펌프·자동기계 등 정교한 장치를 설계·기록함',
          '알이드리시':'시칠리아에서 세계지도와 지리서 『로저의 책』을 제작해 중세 지리학에 큰 자료를 남김',
          '나시르알딘알투시':'마라게 천문대를 세우고 투시쌍 등 천문·수학 모델을 발전시킴',
          '울루그베그':'사마르칸트 천문대를 건설하고 정밀한 별 목록과 천문 관측치를 남김',
          '셀주크':'셀주크 가문의 시조로 후손들이 중동에 대제국을 세울 수 있는 부족·정치 기반을 마련함',
          '투그릴베그':'셀주크 제국을 세우고 바그다드에 입성해 아바스 칼리프의 보호자로 술탄 권력을 확립함',
          '알프아르슬란':'만지케르트 전투에서 비잔티움군을 격파해 튀르크 세력의 아나톨리아 진출을 가속함',
          '말리크샤':'니잠 알물크와 함께 셀주크 제국의 전성기를 이끌고 잘랄리력을 후원함',
          '누르앗딘':'시리아의 이슬람 세력을 통합하고 십자군에 맞서 살라딘의 통일전쟁 기반을 마련함',
          '바이바르스':'맘루크 술탄으로 몽골군과 십자군 세력을 격퇴하며 이집트·시리아의 지배를 강화함',
          '칼라운':'맘루크 왕조를 안정시키고 십자군 거점 공략과 칼라운 가문의 세습 기반을 마련함',
          '오스만1세':'오스만 왕조를 창건해 비잔티움 변경의 소공국을 후대 제국으로 성장시킬 기반을 세움',
          '오르한':'부르사를 장악해 수도로 삼고 정규군·화폐 등 초기 오스만 국가제도를 발전시킴',
          '무라드1세':'발칸 진출을 확대하고 에디르네를 중심으로 오스만 제국의 유럽 지배 기반을 강화함',
          '무라드2세':'바르나 전투와 코소보 전투에서 유럽 연합군을 격파해 발칸 지배를 공고히 함',
          '쾨셈술탄':'여러 술탄의 모후·섭정으로 17세기 오스만 궁정정치에서 막강한 영향력을 행사함',
          '록셀라나':'쉴레이만 1세와 공식 혼인하고 황실 외교·자선사업에 관여해 ‘여성의 술탄국’ 시대를 상징함',
          '메흐메트쾨프륄뤼':'대재상으로 행정기강과 군사력을 회복해 17세기 오스만 제국의 일시적 재건을 이끎',
          '무스타파레시드파샤':'굴하네 칙령을 주도해 탄지마트 개혁의 출발점을 마련하고 근대적 행정·법제 개혁을 추진함',
          '미드하트파샤':'지방행정 개혁과 1876년 오스만 최초 헌법 제정에 핵심 역할을 함',
          '압뒬하미트2세':'근대 교육·철도망을 확대하는 한편 헌법을 정지하고 강한 전제통치를 실시함',
          '엔베르파샤':'청년튀르크 혁명 이후 군부 실력자가 되어 제1차 세계대전 참전과 오스만 군사정책을 주도함',
          '탈라트파샤':'청년튀르크 정권의 핵심 지도자로 제1차 세계대전기 내정과 아르메니아인 강제이주 정책을 주도함',
          '제말파샤':'청년튀르크 정권의 핵심 인물로 제1차 세계대전 중 시리아·팔레스타인 지역을 지휘함',
          '레자샤':'팔레비 왕조를 세우고 군대·교육·교통·행정을 중앙집권적으로 근대화함',
          '모하마드레자팔레비':'백색혁명을 추진해 토지·교육·사회개혁을 실시했으나 권위주의 통치 끝에 1979년 혁명으로 퇴위함',
          '모사데그':'이란 총리로 앵글로이란석유회사를 국유화해 자원주권의 상징이 되었으나 1953년 쿠데타로 축출됨',
          '알리샤리아티':'이슬람과 사회혁명을 결합한 강연·저술로 1979년 이란 혁명 전 지식인 세대에 큰 영향을 줌',
          '자말알딘알아프가니':'범이슬람주의와 반제국주의를 주장하며 이슬람 세계의 정치·종교 개혁운동을 촉진함',
          '무함마드압두':'이집트 대무프티로 이슬람 법과 교육의 개혁, 이성과 신앙의 조화를 주장함',
          '사드자글룰':'와프드당과 1919년 이집트 혁명을 이끌어 영국으로부터의 독립운동을 대중화함',
          '호스니무바라크':'1981년부터 2011년까지 이집트를 장기통치하다 아랍의 봄 시위로 퇴진함',
          '사담후세인':'이라크 대통령으로 권위주의 체제를 구축하고 이란-이라크 전쟁과 쿠웨이트 침공을 일으킴',
          '파이살1세':'아랍 반란에 참여하고 이후 이라크 초대 국왕으로 새 국가의 정치체제를 구축함',
          '압둘아지즈이븐사우드':'아라비아반도 대부분을 통일해 1932년 사우디아라비아 왕국을 세움',
          '파이살빈압둘아지즈':'사우디 국왕으로 국가 현대화와 석유외교를 강화하고 1973년 석유 금수에 관여함',
          '아흐마드샤마수드':'소련의 아프가니스탄 침공과 탈레반에 맞서 판지시르 저항군을 이끈 지휘관',
          '무스타파바르자니':'이라크 쿠르드 민족운동을 이끌고 쿠르디스탄민주당의 기반을 세움',
          '압둘카림카심':'1958년 혁명으로 이라크 왕정을 무너뜨리고 공화정을 수립한 초대 총리',
          '이츠하크라빈':'이스라엘 총리로 오슬로 협정을 추진해 팔레스타인과의 평화협상에 나섰으며 1995년 암살됨',
          '시몬페레스':'오슬로 평화과정의 핵심 협상가로 노벨평화상을 받고 이스라엘 총리·대통령을 지냄',
          '모셰다얀':'이스라엘 군 지휘관·국방장관으로 1967년 6일 전쟁의 군사 지도부를 대표함',
          '테오도르헤르츨':'『유대국가』를 저술하고 세계시온주의기구를 조직해 정치적 시온주의를 체계화함',
          '하임바이츠만':'시온주의 외교를 이끌고 밸푸어 선언 확보에 관여한 뒤 이스라엘 초대 대통령이 됨',
          }
          p=Path('LIST.md');lines=p.read_text(encoding='utf-8').splitlines();out=[];sec=False;heading='';changed=0
          for line in lines:
              if line.strip()=='## 2차 확장 후보':sec=True
              if sec and line.startswith('### '):heading=line[4:].strip()
              if sec and heading=='중동·중앙아시아' and line.startswith('- ') and ' — ' in line:
                  left,_=line[2:].split(' — ',1);name=left.strip()
                  if name in fixes:line=f'- {name} — {fixes[name]}';changed+=1
              out.append(line)
          p.write_text('\n'.join(out)+'\n',encoding='utf-8');print('curated_middle_east=',changed)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LIST.md
          git commit -m "Curate Middle East Central Asia LIST achievements"
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/fix-middle-east-achievements.yml
          git add -A
          git commit -m "Remove Middle East Central Asia curation workflow"
          git push
