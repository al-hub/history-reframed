name: Curate China LIST achievements
on:
  push:
    paths:
      - .github/workflows/fix-china-achievements.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply curated China achievements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          fixes={
          '동중서':'천인감응론과 유교적 정치론을 체계화해 한대 유교 국가이념 형성에 기여함',
          '왕망':'한나라 황위를 빼앗아 신나라를 세우고 토지·화폐·노비 제도의 대규모 개혁을 시도함',
          '광무제':'신나라 혼란을 수습하고 한 왕조를 재건해 후한을 세움',
          '반초':'서역 원정을 이끌어 중앙아시아에서 후한의 영향력을 회복함',
          '반고':'전한의 역사를 정리한 기전체 역사서 『한서』 편찬의 중심 역할을 함',
          '채륜':'후한에서 제지 재료와 공정을 개선한 방법을 보고해 종이 보급 확대에 기여한 인물로 전해짐',
          '장형':'천문 관측기구를 발전시키고 지진 발생을 감지하는 후풍지동의를 제작한 것으로 알려짐',
          '화타':'후한 말 명의로 외과적 치료와 마취약 ‘마비산’을 사용했다는 기록으로 유명함',
          '주유':'적벽대전에서 손권군을 지휘해 조조의 남하를 저지하는 데 핵심 역할을 함',
          '육손':'이릉대전에서 오나라 군대를 지휘해 유비의 촉한군을 크게 격파함',
          '여몽':'오나라 장수로 형주 공략을 성공시켜 관우 세력을 무너뜨리는 데 결정적 역할을 함',
          '관우':'유비를 섬긴 촉한의 장수로 형주를 지켰으며 사후 충의의 상징으로 신격화됨',
          '장비':'유비의 핵심 장수로 촉한 건국 과정의 주요 전투에 참여함',
          '조운':'유비 휘하의 장수로 장판 전투 등에서 활약하며 촉한의 대표적 명장으로 이름을 남김',
          '순욱':'조조의 핵심 참모로 헌제 옹립과 인재 등용을 조언하며 조조 정권의 기반 형성에 기여함',
          '곽가':'조조의 참모로 원소 잔당과 북방 세력 공략에서 전략적 조언을 제공함',
          '가후':'후한 말과 삼국 초기 여러 정권에서 계책을 제시해 조조·조비 정권의 안정에 기여한 책사로 알려짐',
          '방통':'유비의 모사로 익주 진출을 적극 건의해 촉한의 서남부 기반 확보에 기여함',
          '사마소':'조위의 실권을 장악하고 촉한 멸망을 추진해 서진 건국의 기반을 마련함',
          '사마염':'조위에서 선양을 받아 서진을 세우고 오나라를 멸망시켜 중국을 재통일함',
          '왕희지':'『난정서』로 대표되는 서예를 남겨 중국 행서·초서의 전범으로 평가받음',
          '도연명':'전원생활과 은일을 노래한 시와 산문으로 중국 전원시 전통을 확립함',
          '조충지':'원주율을 소수점 아래 7자리 수준까지 계산하고 천문·역법 연구를 발전시킴',
          '효문제':'북위 수도를 뤄양으로 옮기고 한화 정책을 추진해 선비족과 한족 제도의 융합을 가속함',
          '양견':'수나라를 세우고 남북조의 분열을 끝내 중국을 재통일함',
          '이연':'수말 혼란 속에서 당나라를 건국하고 장안에 새 왕조의 기반을 세움',
          '이세민':'당 태종으로 정관의 치를 이끌고 중앙아시아까지 당의 세력을 확대함',
          '위징':'당 태종에게 직언을 아끼지 않은 간관으로 정관의 치를 상징하는 인물이 됨',
          '방현령':'당 태종의 재상으로 법제·행정 정비와 정관의 치 운영을 뒷받침함',
          '두여회':'당 태종의 재상으로 정책 결정과 인재 등용에 참여해 정관의 치를 뒷받침함',
          '현장':'인도까지 순례해 불경을 수집하고 귀국 후 대규모 번역 사업을 진행해 동아시아 불교에 기여함',
          '곽자의':'안사의 난 진압과 당 왕조의 수도 회복에 핵심 역할을 한 장군으로 이름을 남김',
          '한유':'고문운동을 이끌고 유교적 도통론을 강조해 당송 산문과 성리학 형성에 영향을 줌',
          '유종원':'고문운동을 이끈 산문가로 우화·산수기 등 뛰어난 산문 작품을 남김',
          '백거이':'『장한가』·『비파행』 등 이해하기 쉬우면서 사회 현실을 담은 시로 당대 문학을 대표함',
          '왕유':'산수와 자연을 섬세하게 그린 시와 회화로 성당 시문학의 대표 인물이 됨',
          '맹호연':'자연과 전원생활을 노래한 산수전원시로 성당 시단의 한 흐름을 확립함',
          '왕창령':'변방 전쟁과 군인의 삶을 압축적으로 그린 칠언절구로 당대 변경시를 대표함',
          '두목':'역사·정치적 통찰과 세련된 서정을 담은 시로 만당 문학을 대표함',
          '이상은':'정교한 상징과 전고를 활용한 시로 만당 시문학의 독창적 경지를 구축함',
          '황소':'당 말 대규모 농민 반란을 일으켜 장안을 점령하고 당 왕조 쇠퇴를 가속함',
          '조광윤':'송나라를 건국하고 군벌의 병권을 중앙으로 회수해 문치 중심의 중앙집권 체제를 강화함',
          '조광의':'송 태종으로 북한국을 멸망시켜 오대십국 분열의 대부분을 마무리함',
          '구양수':'고문운동을 이끌고 『신오대사』 등을 저술해 북송 문학·역사학을 발전시킴',
          '범중엄':'경력신정을 추진해 북송 정치 개혁을 시도하고 『악양루기』를 남김',
          '소철':'당송팔대가의 한 사람으로 정치 논설과 산문을 남기고 북송 관료로 활동함',
          '소순':'당송팔대가의 한 사람으로 논리적인 역사·정치 산문을 남김',
          '심괄':'『몽계필담』에 자침·지질·천문·수학 등 폭넓은 과학기술 관찰과 연구를 기록함',
          '진회':'남송 재상으로 금나라와의 화의를 주도했으며 악비 처형과 관련해 후대에 큰 논쟁을 남김',
          '문천상':'원나라에 끝까지 항전하고 투항을 거부해 남송 충절의 상징이 됨',
          '육유':'금나라에 빼앗긴 영토 회복을 염원한 애국시를 다수 남겨 남송 시문학을 대표함',
          '주체':'영락제로 즉위해 수도를 베이징으로 옮기고 정화의 원정과 『영락대전』 편찬을 추진함',
          '서광계':'마테오 리치와 『기하원본』을 번역하고 농업·천문 연구를 통해 서양 과학 지식 도입에 기여함',
          '이시진':'약물과 본초 지식을 집대성한 『본초강목』을 편찬해 동아시아 의약학에 큰 영향을 남김',
          '원숭환':'닝위안 전투 등에서 후금군을 저지하며 명나라의 요동 방어를 이끎',
          '정성공':'네덜란드 세력을 타이완에서 축출하고 정씨 정권의 기반을 세움',
          '좌종당':'청 말 신장 지역을 재정복하고 서북 변경 통합과 양무운동을 추진함',
          '캉유웨이':'변법자강론을 제시하고 광서제의 백일유신을 이론적으로 이끈 개혁가가 됨',
          '차이위안페이':'베이징대 총장으로 학문의 자유와 신문화운동을 뒷받침하는 대학 개혁을 추진함',
          '펑더화이':'중국인민지원군 사령관으로 한국전쟁을 지휘했고 훗날 대약진운동의 문제를 공개 비판함',
          '린뱌오':'국공내전에서 동북인민해방군을 지휘해 공산당 승리에 기여했으나 문화대혁명기 후계자 지위에서 몰락함',
          '천윈':'계획경제 운영과 개혁개방 초기의 점진적 시장 개혁 노선에 영향력을 행사함',
          '화궈펑':'마오쩌둥 사후 최고지도자가 되어 사인방 체포를 승인하고 문화대혁명 종결 과정에 관여함',
          '후야오방':'개혁개방 초기 당 총서기로 문화대혁명 피해자 복권과 정치적 개방을 추진함',
          '자오쯔양':'농촌·도시 경제개혁을 추진하고 1989년 톈안먼 시위 무력 진압에 반대하다 실각함',
          '장쩌민':'시장경제 개혁을 확대하고 중국의 세계무역기구 가입 시기를 이끈 최고지도자로 활동함',
          '후진타오':'집권기 고속성장을 이어가며 ‘과학적 발전관’과 ‘조화사회’ 노선을 제시함',
          }
          p=Path('LIST.md');lines=p.read_text(encoding='utf-8').splitlines();out=[];sec=False;heading='';changed=0
          for line in lines:
              if line.strip()=='## 2차 확장 후보':sec=True
              if sec and line.startswith('### '):heading=line[4:].strip()
              if sec and heading=='중국 고대·중세' and line.startswith('- ') and ' — ' in line:
                  left,_=line[2:].split(' — ',1);name=left.strip()
                  if name in fixes:
                      line=f'- {left.strip()} — {fixes[name]}';changed+=1
              out.append(line)
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('curated_china=',changed)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LIST.md
          git commit -m "Curate China LIST achievements"
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/fix-china-achievements.yml
          git add -A
          git commit -m "Remove China LIST curation workflow"
          git push
