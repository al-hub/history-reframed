          '수리야바르만2세':'크메르 제국을 확장하고 앙코르와트를 건설한 군주로 유명함',
          '자야바르만7세':'앙코르 톰과 바이욘을 건설하고 도로·병원 등 대규모 공공사업을 추진함',
          '파라메스와라':'말라카 술탄국의 기초를 세워 말라카를 동서무역의 핵심 항구로 성장시키는 계기를 마련함',
          '항뚜아':'말라카 술탄국에 충성을 다한 전설적 제독·전사로 말레이 문화의 충성 상징이 됨',
          '알라웅파야':'꼰바웅 왕조를 세우고 미얀마 지역을 재통일한 군주',
          '아노라타':'버간 왕국을 통일하고 상좌부불교를 후원해 미얀마 국가·종교 문화의 기반을 다짐',
          '바인나웅':'따웅우 왕조의 영토를 크게 확장해 16세기 동남아 최대 규모의 제국을 구축함',
          '타빈슈웨티':'따웅우 왕조를 확장해 버마 저지대를 통합하고 후대 제국 확대의 기반을 마련함',
          '민돈왕':'만달레이를 건설하고 행정·교육·불교 개혁과 제5차 불교결집을 추진함',
          '티보왕':'꼰바웅 왕조의 마지막 국왕으로 제3차 영국-버마 전쟁 뒤 폐위되어 왕조가 종말을 맞음',
          '네윈':'1962년 군사쿠데타로 정권을 장악하고 ‘버마식 사회주의’를 시행해 장기 군부통치의 기반을 만듦',
          '킹몽꿋':'라마 4세로 서양과의 외교·과학 교류를 확대하고 시암의 근대화 기반을 마련함',
          '쭐랄롱꼰':'라마 5세로 노예제 폐지와 행정·사법·교육 개혁을 추진해 시암의 근대 국가화를 이끎',
