          '에까탓':'아유타야 왕조의 마지막 군주로 재위 중 1767년 버마군에 수도가 함락되어 왕조가 멸망함',
          '응우옌후에':'떠이선 왕조의 꽝쭝 황제로 청군을 격파하고 베트남 북부를 통일함',
          '응우옌푹아인':'자롱 황제로 응우옌 왕조를 세우고 베트남을 통일해 후에를 수도로 삼음',
          '판보이쩌우':'동유운동을 조직해 일본 유학과 무장 독립을 통해 프랑스 식민지배에 저항함',
          '판쩌우찐':'교육·법치·사회개혁을 통한 베트남의 근대화와 식민통치 개혁을 주장함',
          '레주언':'베트남 노동당 지도자로 남베트남에 대한 전쟁 수행과 통일 이후 사회주의 체제를 주도함',
          '팜반동':'호찌민 정부의 외교와 행정을 이끌고 오랫동안 북베트남·통일베트남 총리를 지냄',
          '쯔엉찐':'베트남 공산주의 지도자로 토지개혁과 당 이론을 주도하고 도이머이 전환기에도 영향력을 행사함',
          '응오딘지엠':'남베트남 초대 대통령으로 반공 국가체제를 구축했으나 권위주의 통치 끝에 1963년 쿠데타로 축출됨',
          '응오딘누':'응오딘지엠 대통령의 동생이자 핵심 정치참모로 남베트남 정권의 비밀경찰·정치조직에 큰 영향력을 행사함',
          'S라자라트남':'싱가포르 초대 외무장관으로 독립 초기 외교정책과 아세안 창설에 핵심 역할을 함',
          '유소프빈이삭':'독립 싱가포르의 초대 대통령이 되어 다민족 국가의 상징적 통합을 대표함',
          '투쿠압둘라만':'말라야 독립을 이끌고 말레이시아 초대 총리로 연방 창설을 주도함',
          '압둘라작':'말레이시아 2대 총리로 신경제정책과 농촌개발을 추진하고 아세안 외교를 강화함',
          '후세인온':'말레이시아 3대 총리로 다민족 화합과 법치·반부패를 강조함',
          '마하티르모하맛':'장기 총리 재임 중 산업화·인프라 확충과 ‘동방정책’을 추진해 말레이시아 경제구조를 변화시킴',
          '안와르이브라힘':'개혁운동을 이끈 야권 지도자에서 말레이시아 총리가 되어 다당제 정치 전환의 중심 인물이 됨',
          '모하맛하타':'인도네시아 독립을 선언한 공동지도자이자 초대 부통령으로 협동조합 경제를 강조함',
          '수탄샤리르':'인도네시아 초대 총리로 독립 초기 네덜란드와의 외교협상을 주도함',
          '아구스살림':'인도네시아 독립운동과 외교를 이끌고 독립 초기 외무장관으로 국제승인 확보에 기여함',
          '카르티니':'여성 교육과 지위 향상을 주장한 편지들로 인도네시아 여성해방의 상징이 됨',
          '디포네고로르':'1825~1830년 자바전쟁을 이끌어 네덜란드 식민통치에 대규모로 저항함',
          '가자마다':'마자파힛의 재상으로 누산타라 통합을 목표로 세력 확장을 추진함',
          '하얌우룩':'가자 마다와 함께 마자파힛 제국의 전성기와 광범위한 해상 영향력을 이끎',
          '켄아록':'싱하사리 왕국을 세워 동부 자바의 새로운 왕조 질서를 연 인물로 전해짐',
          '에어랑가':'자바 동부의 분열을 수습해 카후리판 왕국을 재건하고 관개·무역을 발전시킴',
          '다르마왕사':'동부 자바 왕국의 세력 확대와 스리위자야 경쟁을 추진했으나 1016년 침공으로 왕국이 붕괴함',
          '안드레스보니파시오':'카티푸난을 창설해 스페인 식민통치에 맞선 필리핀 혁명을 촉발함',
          '아폴리나리오마비니':'필리핀 혁명정부의 헌정·외교 정책을 설계해 ‘혁명의 두뇌’로 불림',
          '마누엘케손':'필리핀 자치정부 초대 대통령으로 독립 준비와 국어·사회개혁 정책을 추진함',
          '세르히오오스메냐':'제2차 세계대전기 필리핀 대통령으로 망명정부와 전후 국가 복구를 이끎',
          '라몬막사이사이':'반군 진압과 농촌개혁·행정 청렴을 내세워 전후 필리핀 정치의 대중적 지지를 얻음',
          '코라손아키노':'1986년 피플 파워 혁명 뒤 대통령이 되어 마르코스 독재 이후 민주헌정 체제를 복원함',
          '베니그노아키노주니어':'마르코스 독재에 맞선 야권 지도자로 귀국 직후 암살되어 민주화운동의 상징이 됨',
          '페르디난드마르코스':'장기집권과 계엄령으로 권위주의 체제를 구축했으며 1986년 피플 파워 혁명으로 축출됨',
          '카를로스P로물로':'유엔 창립에 참여하고 유엔총회 의장을 지낸 필리핀 외교관으로 국제외교에서 활약함',
          '레아살롱가':'뮤지컬 『미스 사이공』으로 토니상을 수상하고 디즈니 애니메이션의 노래 목소리로 세계적 명성을 얻음',
          '데이비드우나이포니':'호주 원주민 작가·발명가로 양털깎기 장치 등 특허 아이디어와 원주민 권리운동에 기여함',
          '케이트셰퍼드':'뉴질랜드 여성참정권 운동을 이끌어 1893년 세계 최초의 전국 여성선거권 실현에 기여함',
          '에드먼드힐러리':'텐징 노르가이와 함께 1953년 에베레스트 정상에 최초로 오른 것으로 공인됨',
          '캐서린맨스필드':'단편소설 형식을 혁신한 모더니즘 작가로 『가든 파티』 등 작품을 남김',
          '낸시웨이크':'제2차 세계대전 중 프랑스 레지스탕스와 연합군 특수작전에 참여한 첩보·저항운동가',
          '하워드플로리':'페니실린의 정제·임상 사용을 실용화해 항생제 치료 시대를 여는 데 핵심 기여함',
          '존커틴':'제2차 세계대전 중 호주 총리로 대일전쟁과 미국과의 안보협력 전환을 이끎',
          '로버트멘지스':'호주 최장기 총리로 자유당을 창당하고 전후 경제·이민·교육정책을 확대함',
          '고프휘틀럼':'호주 총리로 보편적 의료보험·고등교육 확대·원주민 정책 개혁을 추진함',
          '돈브래드먼':'테스트 크리켓 타율 99.94를 기록해 크리켓 역사상 가장 상징적인 타자 중 한 명이 됨',
          '로드레이버':'남자 테니스에서 두 차례 캘린더 그랜드슬램을 달성한 유일한 선수로 기록됨',
          '이안소프':'올림픽 수영에서 5개의 금메달을 획득하고 자유형 세계기록을 여러 차례 경신함',
          '캐시프리먼':'2000년 시드니 올림픽 여자 400m에서 금메달을 획득해 호주 원주민 스포츠의 상징이 됨',
          '피터잭슨':'『반지의 제왕』 3부작을 연출해 뉴질랜드 영화산업의 세계적 위상을 높임',
          }
          remove={'아웅제야','레네카탈라노스'}
          p=Path('LIST.md');lines=p.read_text(encoding='utf-8').splitlines();out=[];sec=False;heading='';changed=removed=0
          for line in lines:
              if line.strip()=='## 2차 확장 후보':sec=True
              if sec and line.startswith('### '):heading=line[4:].strip()
              if sec and heading=='동남아·오세아니아' and line.startswith('- ') and ' — ' in line:
                  left,_=line[2:].split(' — ',1);name=left.strip()
                  if name in remove:
                      removed+=1;continue
                  if name in fixes:
                      line=f'- {name} — {fixes[name]}';changed+=1
              out.append(line)
          p.write_text('\n'.join(out)+'\n',encoding='utf-8');print(f'curated_sea_oceania={changed} removed={removed}')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LIST.md
          git commit -m "Curate Southeast Asia Oceania LIST achievements"
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/fix-sea-oceania-achievements.yml
          git add -A
          git commit -m "Remove Southeast Asia Oceania curation workflow"
          git push
