name: Curate Southeast Asia Oceania LIST achievements
on:
  push:
    paths:
      - .github/workflows/fix-sea-oceania-achievements.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply curated Southeast Asia and Oceania achievements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          fixes={
